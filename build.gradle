plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0-alpha.3'
group = 'team.civitatum.couple'
base { archivesName = 'civitatum-couple-interactions-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.256'
    runs {
        client { client(); programArguments.addAll '--username', 'CoupleDev', '--width', '1280', '--height', '800' }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'couple_test' }
    }
    mods { civitatum_couple { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { from('LICENSE.txt') }
tasks.register('verifyLogic', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'team.civitatum.couple.LogicChecks'
}
tasks.named('test', Test) { exclude '**/LogicChecks.class' }
tasks.named('check') { dependsOn tasks.named('verifyLogic') }
if (project.hasProperty('smoke')) {
    sourceSets { smoke {} }
    configurations.smokeImplementation.extendsFrom configurations.implementation
    sourceSets.smoke.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.smoke.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    neoForge.mods { couple_test { sourceSet(sourceSets.smoke) } }
}
if (project.hasProperty('ciJar')) { dependencies { runtimeOnly files(project.property('ciJar')) } }
if (project.hasProperty('curiosJar')) { dependencies { runtimeOnly files(project.property('curiosJar')) } }
