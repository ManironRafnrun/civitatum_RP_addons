plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.4.1'
group = 'ru.teacraft.civitatum'
base { archivesName = 'civitatum-character-creation-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.256'
    runs {
        client { client(); programArguments.addAll '--username', 'CivitatumTest', '--width', '1440', '--height', '900' }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'civitatum' }
    }
    mods { civitatum { sourceSet(sourceSets.main) } }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.mojang:datafixerupper:8.0.16'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) { from('LICENSE.txt'); from('NOTICE.txt') }

// Automated in-game checks and screenshots are development-only.
if (project.hasProperty('smoke')) {
    sourceSets { smoke {} }
    configurations.smokeImplementation.extendsFrom configurations.implementation
    sourceSets.smoke.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.smoke.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    neoForge.mods { civitatum_smoke { sourceSet(sourceSets.smoke) } }
    neoForge.runs.gameTestServer { systemProperty 'neoforge.enabledGameTestNamespaces', 'civitatum_smoke' }
}
if (project.hasProperty('female')) {
    dependencies { runtimeOnly files(project.findProperty('femaleJar') ?: 'libs/FemaleGenderMod.jar') }
}
