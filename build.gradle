plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.4.1'
group = 'ru.teacraft.inventory'
base { archivesName = 'civitatum-inventory-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.256'
    runs {
        client { client(); programArguments.addAll '--username', 'InventoryTest', '--width', '1440', '--height', '900' }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'inventory_smoke' }
    }
    mods { civitatum_inventory { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { from('LICENSE.txt') }
if (project.hasProperty('smoke')) {
    sourceSets { smoke {} }
    configurations.smokeImplementation.extendsFrom configurations.implementation
    sourceSets.smoke.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.smoke.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    neoForge.mods { inventory_smoke { sourceSet(sourceSets.smoke) } }
}
if (project.hasProperty('racesJar')) { dependencies { runtimeOnly files(project.property('racesJar')) } }
def compatDirectory = project.findProperty('compatDir') ?: '../compat-reference'
if (project.hasProperty('compat')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'camping.jar', 'curios.jar', 'xaeros-world-map.jar', 'xaerolib.jar' } } }
if (project.hasProperty('accessories')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'accessories.jar', 'owo-lib.jar' } } }
if (project.hasProperty('aether')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'aether.jar', 'owo-lib.jar' } } }
if (project.hasProperty('apothic')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'apothic-attributes.jar', 'placebo.jar' } } }
if (project.hasProperty('revisionSmoke')) { neoForge.runs.client.systemProperty 'inventory.smoke.revision', 'true' }
if (project.hasProperty('compatOnly')) { neoForge.runs.client.systemProperty 'inventory.smoke.compatOnly', 'true' }
if (project.hasProperty('accessoriesOnly')) { neoForge.runs.client.systemProperty 'inventory.smoke.accessoriesOnly', 'true' }

if (project.hasProperty('ars')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'ars-nouveau.jar', 'geckolib.jar', 'curios.jar' } } }
if (project.hasProperty('updateSmoke')) { neoForge.runs.client.systemProperty 'inventory.smoke.update', 'true' }
