org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# NeoForge every mod is built against
neo_version=21.1.256

# installToInstance puts the built jar into the mods folder of a local game instance.
# The path differs per computer, so set it in your own ~/.gradle/gradle.properties
# (Windows: C:\Users\<you>\.gradle\gradle.properties), not here. Absolute or relative to your home folder,
# use forward slashes (a backslash is an escape character in .properties files), for example:
#   Prism Launcher, Windows:       instanceDir=AppData/Roaming/PrismLauncher/instances/<instance>/minecraft
#   Prism Launcher, Linux:         instanceDir=.local/share/PrismLauncher/instances/<instance>/minecraft
#   Prism Launcher, Linux Flatpak: instanceDir=.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances/<instance>/minecraft
#   CurseForge, Windows:           instanceDir=curseforge/minecraft/Instances/<instance>
instanceDir=changeme