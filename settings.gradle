pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
    plugins {
        id 'net.neoforged.moddev' version '2.0.148'
    }
}

plugins {
    // lets Gradle download a JDK 21 when the one running it is a different version
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'civitatum-rp-addons'

// one module per mod
include 'inventory'
include 'character-creation'
include 'couple-interactions'
include 'menu'
