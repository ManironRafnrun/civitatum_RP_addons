plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    // Better ModList: its mods screen opens from our mods button when it is installed
    compileOnly 'maven.modrinth:better-modlist:21.1.4'
    // Supplementaries 1.21.1-3.9.9 for NeoForge (Modrinth version id): its gear button is removed from our screen
    compileOnly 'maven.modrinth:supplementaries:WrZWfRjP'
    // Quark 4.1-487 (Modrinth version id): its "q" button is moved to our top-right row
    compileOnly 'maven.modrinth:quark:18h0L19k'
}
