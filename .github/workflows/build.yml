name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Проверить Starclock на тестовом сервере NeoForge
        if: hashFiles('starclock/src/gameTest/**/*.java') != ''
        run: ./gradlew :starclock:runGameTestServer

      - name: Подготовить проверку клиента
        run: python3 starclock/tools/prepare_client_checks.py --project starclock

      - name: Подготовить графическое окружение
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64

      - name: Проверить рендер и совместимость с Punchy
        run: python3 starclock/tools/run_client_checks.py

      - name: Сохранить Starclock и результаты проверки
        if: always() && hashFiles('starclock/build/libs/*.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: civitatum-starclock-${{ github.sha }}
          path: |
            starclock/build/libs/*.jar
            starclock/build/generated/starclockResources/
            starclock/build/reports/tests/test/
            starclock/build/test-results/test/
            starclock/build/gameTestRun/logs/
            starclock/build/clientCheckReports/
            starclock/build/clientCheckRun/dependency-manifest.json
          if-no-files-found: error
          retention-days: 30
