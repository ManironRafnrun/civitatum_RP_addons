name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build
      - name: Retain Books jar and test reports
        if: always() && github.ref == 'refs/heads/codex/books/development'
        uses: actions/upload-artifact@v4
        with:
          name: civitatum-books-build
          path: |
            books/build/libs/*.jar
            books/build/reports/tests/test/
            books/build/test-results/test/
          if-no-files-found: warn
